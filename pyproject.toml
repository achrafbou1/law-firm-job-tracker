[project]
name = "law-firm-job-scraper"
version = "0.1.0"
description = "Scrapes job listings from law firm career pages"
requires-python = ">=3.13"
dependencies = [
    "apify-client>=2.3.0",
    "apscheduler>=3.11.2",
    "croniter>=6.0.0",
    "loguru>=0.7.3",
    "pyairtable>=3.3.0",
    "pycountry>=26.2.16",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sendgrid>=6.12.5",
    "tenacity>=9.1.2",
    "tzdata>=2025.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
