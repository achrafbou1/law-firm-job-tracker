name: CI/CD to DigitalOcean

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          ENV: test
        run: .venv/bin/pytest -v

  build_deploy:
    needs: [test]
    environment: prod
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to DigitalOcean via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DIGITALOCEAN_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DEPLOY_USER: ${{ secrets.DIGITALOCEAN_USER }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          DEBUG_EMAIL: ${{ secrets.DEBUG_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          set -euxo pipefail

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts || true

          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << EOF
              set -euxo pipefail
              cd law-firm-job-tracker
              git pull origin master
              docker build -t law-firm-job-tracker:latest .
              docker stop law-firm-job-tracker 2>/dev/null || echo "Container not running"
              docker rm law-firm-job-tracker 2>/dev/null || echo "Container does not exist"
              docker run -d \
              --restart always \
              -e AIRTABLE_TOKEN="$AIRTABLE_TOKEN" \
              -e APIFY_API_KEY="$APIFY_API_KEY" \
              -e SENDGRID_API_KEY="$SENDGRID_API_KEY" \
              -e SENDER_EMAIL="$SENDER_EMAIL" \
              -e DEBUG_EMAIL="DEBUG_EMAIL" \
              -e RECEIVER_EMAIL="$RECEIVER_EMAIL" \
              --name law-firm-job-tracker law-firm-job-tracker:latest
              echo "Deployment completed successfully"
          EOF
