name: CI/CD to DigitalOcean

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_deploy:
    environment: prod
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to DigitalOcean via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DIGITALOCEAN_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DEPLOY_USER: ${{ secrets.DIGITALOCEAN_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          ssh -vvv -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd $DEPLOY_PATH
            git pull origin master
            docker build -t law-firm-scraper:latest .
            docker stop law-firm-scraper || true
            docker rm law-firm-scraper || true
            docker run -d --name law-firm-scraper law-firm-scraper:latest
            echo "Deployment completed successfully"
          EOF
